# Generated by workflow.py

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call: # publish.yml calls this, so a release re-runs every gate before it ships

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest ".[all]"
      - run: python -m pytest tests -q

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"] # the ends of the range: the middle is covered on Linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest ".[all]"
      # no server here, so whatever needs one skips itself
      - run: python -m pytest tests -q

  wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install build
      - run: python -m build
      - run: pip install pytest "$(echo dist/*.whl)[all]"
      # pyproject carries the pytest config; no source tree beside it, so the wheel answers
      - run: mkdir /tmp/t && cp -r tests pyproject.toml /tmp/t/
      - run: cd /tmp/t && python -m pytest tests
