[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfmarq"
version = "0.6.1"
description = "PDF generation library with fluent API and optional markdown support"
readme = "readme.md"
license = "MIT"
license-files = ["license"]
requires-python = ">=3.10"
authors = [{name = "Xaeian"}]
keywords = ["pdf", "reportlab", "document", "generation", "markdown"]
dependencies = ["reportlab", "Pillow", "svglib"]

[project.optional-dependencies]
emoji = []
highlight = ["Pygments"]
markdown = ["markdown-it-py"]
math = ["matplotlib"]
mathjax = []
md = ["Jinja2>=3.1.6", "PyYAML", "Pygments", "emoji", "fonttools", "markdown-it-py", "matplotlib", "mdit-py-emoji", "mdit-py-plugins", "pyphen"]
mermaid = []
all = ["Jinja2>=3.1.6", "PyYAML", "Pygments", "emoji", "fonttools", "markdown-it-py", "matplotlib", "mdit-py-emoji", "mdit-py-plugins", "pyphen"]

[project.urls]
Repository = "https://github.com/Xaeian/PDFMarQ"

[tool.setuptools.packages.find]
include = ["pdfmarq*"]

[tool.setuptools.package-data]
pdfmarq = ["md/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_functions = ["*"]
